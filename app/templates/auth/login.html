{% extends "base.html" %}
{% block title %}Log In - SpendWise{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-logo"><span class="brand-mark">SW</span> SpendWise</div>
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-sub">Log in to review your ledger.</p>
        <form method="POST">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="btn btn-primary">Log In</button>
        </form>
        <p>Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
    </div>
</div>
{% endblock %}
